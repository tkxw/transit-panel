<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Transit Panel{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    {% if session.logged_in %}
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">◈</span>
                    <span class="logo-text">Transit Panel</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <span class="nav-icon">📊</span>
                    <span>仪表盘</span>
                </a>
                <a href="{{ url_for('inbounds') }}" class="nav-item {% if request.endpoint == 'inbounds' %}active{% endif %}">
                    <span class="nav-icon">📥</span>
                    <span>入站管理</span>
                </a>
                <a href="{{ url_for('outbounds') }}" class="nav-item {% if request.endpoint == 'outbounds' %}active{% endif %}">
                    <span class="nav-icon">📤</span>
                    <span>出站管理</span>
                </a>
                <a href="{{ url_for('routes') }}" class="nav-item {% if request.endpoint == 'routes' %}active{% endif %}">
                    <span class="nav-icon">🔀</span>
                    <span>中转规则</span>
                </a>
                <a href="{{ url_for('settings') }}" class="nav-item {% if request.endpoint == 'settings' %}active{% endif %}">
                    <span class="nav-icon">⚙️</span>
                    <span>系统设置</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="{{ url_for('logout') }}" class="nav-item logout">
                    <span class="nav-icon">🚪</span>
                    <span>退出登录</span>
                </a>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <header class="top-bar">
                <h1 class="page-title">{% block page_title %}仪表盘{% endblock %}</h1>
                <div class="user-info">
                    <span class="username">{{ session.username }}</span>
                </div>
            </header>
            
            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    {% else %}
    {% block auth_content %}{% endblock %}
    {% endif %}
    
    <!-- Toast 通知 -->
    <div id="toast-container"></div>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
